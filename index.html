<style>
:root{--bg:#F4F8EE;--card:#fff;--border:#DCE8D2;--text:#23331F;--muted:#56634F;--accent:#4E7A3C;--onAccent:#fff;--streak:#B04A70;--onStreak:#fff;--stat1:#B04A70;--stat2:#4E7A3C;--navBg:#fff;--navBorder:#DCE8D2;--empty:#B9C7AE;--cupEmpty:#DCE8D2;--star1:transparent;--star2:transparent;--display:'Cormorant Garamond',serif}

function gdone(S,k,g){var v=gval(S,k,g);return g.type==='count'?(+v||0)>=(g.min||g.target):!!v}
function weekStart(k){return addDays(k,-wdOf(k))}
function weekCount(S,g,k,through){var ws=weekStart(k),n=0;for(var i=0;i<7;i++){var d=addDays(ws,i);if(through&&d>through)break;if(!activeOn(g,d))continue;if(gdone(S,d,g))n++}return n}
function weekTarget(g,k){var ws=weekStart(k),from=(g.since&&g.since>ws)?g.since:ws;return Math.max(1,Math.min(g.perWeek||1,7-wdOf(from)))}
function goalOk(S,k,g){if(!isWeekly(g))return gdone(S,k,g);var tg=weekTarget(g,k),have=weekCount(S,g,k,k);return have>=tg||have+(6-wdOf(k))>=tg}
function status(S,k){
 var t=todayKey();
 if(k>t)return 'future';
 if(k<S.start)return 'before';
 var gs=goalsFor(S,k);
 if(!gs.length)return 'none';
 var n=0,raw=0;gs.forEach(function(g){if(goalOk(S,k,g))n++;if(gdone(S,k,g))raw++});
 if(n===gs.length)return 'done';
 if(entry(S,k).forgiven)return 'forgiven';
 var any=raw>0;
 if(!any){var e=entry(S,k).g;for(var id in e){if(e[id]&&(e[id].v||e[id].note))any=true}}
 return any?'partial':'missed';
}
function streak(S){
 var k=todayKey(),s=0,guard=0;
 if(status(S,k)!=='done')k=addDays(k,-1);
 while(guard++<3000){
  if(k<S.start)break;
  var st=status(S,k);
  if(st==='done'||st==='forgiven')s++;
  else if(st!=='none')break;
  k=addDays(k,-1);
 }
 return s;
}
function totalDone(S){var n=0;for(var k in S.log){if(status(S,k)==='done')n++}return n}
function tokens(S){var earned=1+Math.floor(totalDone(S)/7);return Math.max(0,Math.min(2,earned-S.usedTokens))}
function canForgiveYesterday(S){
 var y=addDays(todayKey(),-1);
 if(y<S.start)return false;
 var st=status(S,y);
 if(st!=='missed'&&st!=='partial')return false;
 var b=status(S,addDays(y,-1));
 return (b==='done'||b==='forgiven')&&tokens(S)>0;
}
function forgiveYesterday(S){
 var y=addDays(todayKey(),-1);
 if(!canForgiveYesterday(S))return false;
 S.log[y]=S.log[y]||{g:{}};S.log[y].forgiven=true;S.usedTokens++;return true;
}
/* vráti zoznam novo odomknutých tém */
function refreshProgress(S){
 var cur=streak(S);if(cur>S.best)S.best=cur;
 var fresh=[];
 ACOTAR.forEach(function(t){if(S.best>=t.unlockAt&&S.unlocked.indexOf(t.id)<0){S.unlocked.push(t.id);fresh.push(t.id)}});
 return fresh;
}
function nextCourt(S){for(var i=0;i<ACOTAR.length;i++){if(S.unlocked.indexOf(ACOTAR[i].id)<0)return ACOTAR[i]}return null}
function plural(n,one,few,many){return n===1?one:(n>=2&&n<=4?few:many)}
function unitWord(n,u){return u==='noc'?plural(n,'noc','noci','nocí'):plural(n,'deň','dni','dní')}
function setVal(S,k,g,v){S.log[k]=S.log[k]||{g:{}};var e=S.log[k].g[g.id]||{v:g.type==='count'?0:false,note:'',e:''};e.v=v;S.log[k].g[g.id]=e}

function svg(name,size,sw){return '<svg width="'+(size||22)+'" height="'+(size||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||1.6)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||name)+'</svg>'}

 var T=todayKey(),nowSt=status(S,T),celebrate=lastTodayStatus!==null&&lastTodayStatus!=='done'&&nowSt==='done'&&S.celebrated!==T;

 dbRef.set(JSON.parse(JSON.stringify(S))).then(function(){view.sync='cloud'},function(e){if(e&&e.code==='invalid_argument'||e&&e.code==='revoked'){dbRef=null;view.sync='local'}}).then(function(){writing=false;if(pendingWrite){pendingWrite=false;doWrite()}});
}

 if(!window.claude||!window.claude.use)return;
 Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
  var user=r[0],db=r[1];if(!user||!db)return;

   if(!uid)return;
   var ref=db.doc('data/users/'+uid+'/state');
   return ref.get().then(function(snap){
    dbRef=ref;view.sync='cloud';
    if(snap.exists){
     var remote=snap.data()||{};
     if((remote.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(remote)));refreshProgress(S);saveLocal();}
     else if((S.updatedAt||0)>(remote.updatedAt||0))queueWrite();
    } else if(S.updatedAt) queueWrite();
    render();
   });
  });

}

 h+='</div>';
 if(nc){var need=nc.unlockAt-S.best;h+='<div><div class="small" style="display:flex;justify-content:space-between"><span>Ďalší: <b style="color:var(--text)">'+esc(nc.name)+'</b></span><span>ešte '+need+' '+unitWord(need,'den')+'</span></div><div class="progress"><i style="width:'+Math.min(100,Math.round(S.best/nc.unlockAt*100))+'%"></i></div></div>'}
 else h+='<span class="small">Všetky dvory odomknuté. Vysoká lady.</span>';
 h+='<div class="sstrip"><span><b style="color:var(--stat1)">'+x+'</b> '+plural(x,'deň','dni','dní')+' do Vianoc</span><span><b style="color:var(--stat2)">'+tot+'</b> '+plural(tot,'splnený deň','splnené dni','splnených dní')+'</span></div></div>';
 // goals

 h+='<div class="row" style="justify-content:space-between;margin-top:4px"><h2>'+(isToday?'Dnešné ciele':'Ciele')+'</h2><span class="small">'+WD[wdOf(k)]+' '+fmtDay(k)+'</span></div>';
 if(!activeGoals(S).length)h+='<div class="card stack" style="text-align:center;padding:22px;align-items:center"><span class="gname">Zatiaľ žiadne ciele</span><span class="small">Vyber si 1 až 3 a ideme na to.</span><button class="btn solid" data-a="onbStart" data-v="2">Vybrať ciele</button></div>';
 else if(!gs.length)h+='<div class="card small" style="text-align:center;padding:20px">Dnes nemáš naplánované nič. Oddych je tiež tréning.</div>';
 gs.forEach(function(g){h+=renderGoal(g,k,t)});

function quip(gs,k,t){

 if(w&&!gdone(S,k,w)){var left=w.target-(+gval(S,k,w)||0);return 'Ešte '+left+' '+plural(left,'pohár','poháre','pohárov')+'.'+t.left}

function missingText(k){
 var st=status(S,k);if(st==='done'||st==='forgiven'||st==='none')return '';
 var gs=goalsFor(S,k),miss=gs.filter(function(g){return !goalOk(S,k,g)});
 var names=miss.map(function(g){return isNum(modeOf(g))?g.name+' ('+(+gval(S,k,g)||0)+' z '+g.target+')':g.name});
 var r=Math.floor(dateOf(k).getTime()/86400000);
 if(st==='missed'){var E=['Tento deň ostal celý prázdny. Aj hrdinky majú voľno.','Ticho. Žiadny záznam. Podozrivé.','Deň na gauči? Dvor to nezabudne.'];return E[r%E.length]}
 if(names.length===1){var O=['Skoro dokonalé. Len {x} sa niekde zatúlalo.','Všetko super, až na {x}. Nabudúce to dáš.','{x} si v ten deň dalo voľno. Ty si makala.'];return O[r%O.length].replace('{x}',names[0])}
 var list=names.slice(0,-1).join(', ')+' a '+names[names.length-1];
 var M=['Pár vecí ti ušlo: {x}. Zajtra ich chytíš.','Dobrý pokus. Chýbalo: {x}.','Niečo si dala, niečo nie. Ušlo: {x}.'];return M[r%M.length].replace('{x}',list);
}

function renderCourts(){

function lineCat(g){if(g.cat)return g.cat;return g.kind==='exercise'?'move':(g.kind==='water'||g.kind==='sweet')?'food':'other'}
function pickLine(g,k){
 var set=LINES[S.theme]||LINES.spring,arr=set[lineCat(g)]||set.other;
 if(g.kind==='sweet')return arr[0];
 if(g.kind==='water')return arr[1];
 var day=Math.floor(dateOf(k).getTime()/86400000),gi=S.goals.indexOf(g);
 return arr[(day+gi)%arr.length];
}

var END_LINES={
 done:['Návyk je tvoj. Tamlin by plakal, Rhys by tlieskal.','Toto si zaslúži tanec. Aspoň v kuchyni.','Hotovo. Teraz to robíš aj bez appky. Trochu žiarlime.','Oficiálne: si človek, ktorý veci dotiahne.','Amren by povedala „nebolo to zlé“. U nej je to potlesk.'],

function goalStats(g){
 var n=0,first=null,last=null;
 for(var k in S.log){var e=S.log[k].g&&S.log[k].g[g.id];if(!e)continue;if(!activeOn(g,k))continue;if(gdone(S,k,g)){n++;if(!first||k<first)first=k;if(!last||k>last)last=k}}
 var from=g.since||S.start,to=g.until||todayKey();
 var span=Math.max(1,Math.round((dateOf(to)-dateOf(from))/86400000)+1);
 return {done:n,weeks:Math.max(1,Math.ceil(span/7)),days:span};
}
function endGoal(id,how){
 var g=goal(id);if(!g)return;var T=todayKey();
 g.until=addDays(T,-1);g.ended={how:how,date:T};
 var st=goalStats(g);
 view.editGoal=null;view.endAsk=null;
 view.toast={type:'end',how:how,name:g.name,stats:st,line:END_LINES[how][Math.floor(Math.random()*END_LINES[how].length)]};
 commit();
 launchConfetti(how==='done'?'happy':'sad');
}
function restoreGoal(id){
 var g=goal(id);if(!g)return;var ng={};for(var k in g)ng[k]=g[k];
 ng.id='g'+Date.now().toString(36);ng.since=todayKey();delete ng.until;delete ng.ended;
 S.goals.push(ng);commit();
}
function deleteGoalFully(id){
 S.goals=S.goals.filter(function(x){return x.id!==id});
 for(var k in S.log){if(S.log[k].g&&S.log[k].g[id])delete S.log[k].g[id]}
}

}

function launchConfetti(kind){
 try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
 var c=document.createElement('canvas');c.setAttribute('aria-hidden','true');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
 document.body.appendChild(c);var dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;var x=c.getContext('2d');x.scale(dpr,dpr);
 var sad=kind==='sad',cs=getComputedStyle(document.documentElement);
 var cols=sad?['#9AA3B5','#B7BECC','#7D8699','#C9CED8']:[cs.getPropertyValue('--streak').trim()||'#F1E3B0',cs.getPropertyValue('--accent').trim()||'#A493FF','#F2A9CF','#F1E3B0','#9FE3A8','#8FD3FF'];
 var P=[],n=sad?40:140;
 for(var i=0;i<n;i++)P.push(sad?{x:Math.random()*W,y:-30+Math.random()*H*0.55,vx:0,vy:1+Math.random()*0.9,r:Math.random()*6,s:5+Math.random()*5,c:cols[i%cols.length],ph:Math.random()*6}:{x:W/2+(Math.random()-.5)*60,y:H*0.35,vx:(Math.random()-.5)*11,vy:-6-Math.random()*8,r:Math.random()*6,s:5+Math.random()*6,c:cols[i%cols.length],ph:Math.random()*6});
 var t0=performance.now(),dur=sad?4200:3200;
 (function f(now){var t=now-t0;x.clearRect(0,0,W,H);
  P.forEach(function(p){if(sad){p.ph+=0.03;p.x+=Math.sin(p.ph)*0.6;p.y+=p.vy;p.r+=0.01}else{p.vy+=0.25;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=0.1}
   x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-t/dur);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(t<dur)requestAnimationFrame(f);else c.remove();})(t0);
}

function goal(id){for(var i=0;i<S.goals.length;i++)if(S.goals[i].id===id)return S.goals[i]}
var formDays=null;
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),k=view.dayKey;

 if(a==='closeSheetBg'){if(ev.target===el){view.sheet=false;view.editGoal=null;render()}return}
 if(a==='note'||a==='name'||a==='importText'||a==='start')return;
 switch(a){
  case 'tab':view.tab=v;if(v==='today')view.dayKey=todayKey();render();window.scrollTo(0,0);break;
  case 'check':var g=goal(id);setVal(S,k,g,!gval(S,k,g));commit();break;
  case 'inc':g=goal(id);setVal(S,k,g,Math.min(g.target*3,(+gval(S,k,g)||0)+1));commit();break;
  case 'dec':g=goal(id);setVal(S,k,g,Math.max(0,(+gval(S,k,g)||0)-1));commit();break;
  case 'choose':g=goal(id);S.log[k]=S.log[k]||{g:{}};var ce=S.log[k].g[id]||{v:false,note:'',e:''};ce.c=v;ce.v=true;S.log[k].g[id]=ce;commit();break;
  case 'onbStart':startOnboarding(+(v||1));break;

  case 'emoji':g=goal(id);S.log[k]=S.log[k]||{g:{}};var e=S.log[k].g[id]||{v:g.type==='count'?0:false,note:'',e:''};e.e=e.e===v?'':v;S.log[k].g[id]=e;commit();break;
  case 'forgive':if(forgiveYesterday(S))commit();break;
  case 'backToday':view.dayKey=todayKey();render();break;
  case 'calPrev':case 'calNext':var p=view.calMonth.split('-'),d=new Date(+p[0],+p[1]-1+(a==='calNext'?1:-1),1);view.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break;
  case 'calSel':view.calSel=view.calSel===v?null:v;render();break;

  case 'setTheme':S.theme=v;view.toast=null;commit();break;
  case 'closeToast':view.toast=null;render();break;
  case 'settings':view.sheet=true;view.importMsg='';render();break;
  case 'closeSheet':view.sheet=false;view.editGoal=null;view.reorder=false;render();break;
  case 'editGoal':view.editGoal=id;view.confirmDel=null;var gg=id==='new'?null:goal(id);formDays=gg?gg.days.slice():[0,1,2,3,4,5,6];render();break;
  case 'moveGoal':var A=activeGoals(S),ai=-1;A.forEach(function(x,i){if(x.id===id)ai=i});var aj=ai+(+v);if(ai>=0&&aj>=0&&aj<A.length){var mi=S.goals.indexOf(A[ai]),mj=S.goals.indexOf(A[aj]);var tmp=S.goals[mi];S.goals[mi]=S.goals[mj];S.goals[mj]=tmp;commit()}break;
  case 'endAsk':view.endAsk=id;render();break;

  case 'endCancel':view.endAsk=null;render();break;

  case 'doImport':try{var obj=JSON.parse(view.importText);if(!obj||!obj.goals||!obj.log)throw 0;S=normalize(obj);view.importText='';view.importMsg='Obnovené.';commit()}catch(x){view.importMsg='Toto nevyzerá ako záloha z appky.';render()}break;
