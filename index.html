<style>
:root{--bg:#F4F8EE;--card:#fff;--border:#DCE8D2;--text:#23331F;--muted:#56634F;--accent:#4E7A3C;--onAccent:#fff;--streak:#B04A70;--onStreak:#fff;--stat1:#B04A70;--stat2:#4E7A3C;--navBg:#fff;--navBorder:#DCE8D2;--empty:#B9C7AE;--cupEmpty:#DCE8D2;--star1:transparent;--star2:transparent;--display:'Cormorant Garamond',serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;transition:background-color .4s}
body.sky{background-image:radial-gradient(1.2px 1.2px at 8% 6%,var(--star1),transparent),radial-gradient(1px 1px at 31% 3%,var(--star2),transparent),radial-gradient(1.4px 1.4px at 77% 8%,var(--star1),transparent),radial-gradient(1px 1px at 90% 19%,var(--star2),transparent),radial-gradient(1px 1px at 54% 14%,var(--star1),transparent),radial-gradient(1.2px 1.2px at 15% 36%,var(--star2),transparent),radial-gradient(1px 1px at 95% 50%,var(--star1),transparent),radial-gradient(1px 1px at 5% 66%,var(--star2),transparent),radial-gradient(1.2px 1.2px at 85% 76%,var(--star1),transparent),radial-gradient(1px 1px at 38% 90%,var(--star2),transparent);background-attachment:fixed}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500;text-transform:uppercase}
h1{margin:4px 0 0;font-family:var(--display);font-weight:600;font-size:31px;line-height:1.1}
h2{margin:0;font-size:15px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--accent);flex-shrink:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack>*{flex-shrink:0}
.streak{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 16px;border-radius:24px}
.big{font-family:var(--display);font-weight:600;font-size:80px;line-height:.95;color:var(--streak)}
.dots{display:flex;gap:8px;margin-top:10px}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1.5px solid color-mix(in srgb,var(--muted) 70%,var(--card));color:var(--muted)}
.dot.done{background:var(--streak);border-color:var(--streak);color:var(--onStreak)}
.dot.forgiven{border-color:var(--streak);border-style:dashed;color:var(--streak)}
.dot.today{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--accent)}
.small{font-size:12px;color:var(--muted)}
.progress{width:100%;height:6px;border-radius:3px;background:var(--cupEmpty);overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.gname{font-size:15px;font-weight:600;display:block}
.gsub{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.gtap{background:none;border:none;text-align:left;padding:0;width:100%;min-height:44px}
.check{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;transition:transform .15s}
.check.on{background:var(--accent);color:var(--onAccent)}
.check:active,.pill:active{transform:scale(.92)}
.pill{height:46px;padding:0 15px;border-radius:23px;border:none;background:var(--accent);color:var(--onAccent);font-size:14px;font-weight:600;flex-shrink:0;transition:transform .15s}
.pill.ghost{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:0;width:46px}
.cups{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.cup{width:17px;height:22px;border-radius:3px 3px 7px 7px;background:transparent;border:1.5px solid color-mix(in srgb,var(--accent) 55%,var(--card))}
.cup.on{border-color:var(--accent)}
.cup.wk{width:22px;height:8px;border-radius:4px}
.cup.on{background:var(--accent)}
.extra{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emo{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:20px;padding:0}
.emo.on{border:2px solid var(--accent)}
.quip{text-align:center;font-family:var(--display);font-style:italic;font-size:18px;color:var(--streak);margin:6px 8px 0}
.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;border-radius:16px;padding:12px 14px;background:var(--card);border:1.5px dashed var(--accent);font-size:14px}
.banner .pill{height:40px;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--navBg);border-top:1px solid var(--navBorder);padding:6px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:center;z-index:5}
nav.tabs .in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
nav.tabs button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);min-height:48px;padding:6px 0}
nav.tabs button.on{color:var(--accent);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.cday{aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;gap:1px}
.cday small{font-size:12px;line-height:1}
.cday.done{background:var(--streak);border-color:var(--streak);color:var(--onStreak)}
.cday.forgiven{border:1.5px dashed var(--streak)}
.cday.partial{border-color:var(--accent)}
.cday.future,.cday.before{opacity:.45}
.cday.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.court{display:flex;gap:12px;align-items:center}
.sw{display:flex;flex-shrink:0;border-radius:14px;overflow:hidden;width:56px;height:56px;border:1px solid var(--border)}
.sw i{flex:1}
.locked{opacity:.75}
.sheet{position:fixed;inset:0;background:rgba(5,6,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 24px)}
.modal{position:fixed;inset:0;background:rgba(5,6,15,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.modal .in{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.days7{display:flex;gap:6px}
.days7 button{flex:1;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;padding:0}
.days7 button.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:600;font-size:14px}
.btn.solid{background:var(--accent);color:var(--onAccent)}
.btn.danger{border-color:#B3261E;color:#B3261E}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cbadge{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600}
.onb{position:fixed;inset:0;z-index:40;background:#0A0E24;color:#ECEEF8;overflow-y:auto;-webkit-overflow-scrolling:touch;background-image:radial-gradient(1.2px 1.2px at 8% 6%,#fff,transparent),radial-gradient(1px 1px at 31% 3%,#C9CEDD,transparent),radial-gradient(1.4px 1.4px at 77% 8%,#F1E3B0,transparent),radial-gradient(1px 1px at 90% 19%,#C9CEDD,transparent),radial-gradient(1px 1px at 54% 14%,#fff,transparent),radial-gradient(1.2px 1.2px at 15% 30%,#C9CEDD,transparent),radial-gradient(1px 1px at 62% 24%,#F1E3B0,transparent)}
.onb .in{max-width:480px;margin:0 auto;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:calc(env(safe-area-inset-top) + 24px) 22px calc(env(safe-area-inset-bottom) + 24px)}
.onb .gname{color:#ECEEF8}
.odots{display:flex;gap:6px;align-items:center}.odots i{display:block;height:6px;width:6px;border-radius:3px;background:#2A3266}.odots i.on{background:#A493FF}.odots i.cur{width:24px}
.oh1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px;line-height:1.05}
.osub{margin:6px 0 0;font-size:15px;line-height:1.5;color:#A9AFD0}
.ocenter{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.omedal{width:112px;height:112px;border-radius:50%;background:#141A3A;border:1px solid #3A3F80;display:flex;align-items:center;justify-content:center;color:#F1E3B0;box-shadow:0 0 60px rgba(241,227,176,.18)}
.ofield{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:500;color:#A9AFD0;width:100%;text-align:left;margin-top:6px}
.ofield input{height:52px;border-radius:16px;border:1px solid #2A3266;background:#141A3A;color:#ECEEF8;padding:0 16px;font-size:17px}
.ostack{display:flex;flex-direction:column;gap:8px;align-items:center}
.obtn{height:54px;border-radius:27px;border:none;background:#A493FF;color:#0A0E24;font-size:16px;font-weight:600;width:100%;flex-shrink:0}
.obtn[disabled]{opacity:.45}
.obtn-link{background:none;border:none;color:#C9BEFF;font-size:14px;padding:12px;min-height:44px}
.ogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.otile{position:relative;min-height:104px;border-radius:20px;border:1px solid #2A3266;background:#141A3A;color:#ECEEF8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 6px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.otile.on{border:2px solid var(--c);background:#1B2250}
.oico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);flex-shrink:0}
.oico.sm{width:42px;height:42px;border-radius:14px}
.obadge{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#0A0E24;display:flex;align-items:center;justify-content:center}
.ogrow{flex:1}
.osec{display:flex;flex-direction:column;gap:7px}
.osech{display:flex;align-items:center;gap:8px;color:var(--c);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.oopt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:14px;border:1px solid #2A3266;background:#141A3A;color:#ECEEF8;text-align:left;font-size:14px;font-weight:500}
.oopt.on{border:1.5px solid var(--c);background:#1B2250;font-weight:600}
.obox{width:20px;height:20px;border-radius:50%;border:1.5px solid #4A5490;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0A0E24}
.oopt.on .obox{border-color:var(--c);background:var(--c)}
.otag{font-size:12px;color:#A9AFD0;font-weight:500;text-align:right}
.ostep{display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 42px;font-size:12px;color:#A9AFD0}
.ostep b{color:#ECEEF8;min-width:84px;text-align:center;font-size:13px}
.ostepb{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--c);background:transparent;color:var(--c);font-size:18px;font-weight:600;padding:0}
.oadd{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:14px;border:1px dashed var(--c);background:none;color:var(--c);font-size:13px;font-weight:600;text-align:left}
.ocard{background:#141A3A;border:1px solid #2A3266;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.osd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1.5px solid #4A5490;color:#A9AFD0}
.osd.on{background:#F1E3B0;border-color:#F1E3B0;color:#0A0E24}
.ocourt{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:#A9AFD0}
.ocourt i{width:34px;height:34px;border-radius:11px;border:1px solid #3A4378;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px;box-sizing:border-box;opacity:.5}
.ocourt i b{display:block;width:11px;height:11px;border-radius:4px}
.ocourt.on i{opacity:1;border:2px solid #F1E3B0}
.ochip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:12px;padding:7px 10px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>

function fmtDay(k){var d=dateOf(k);return d.getDate()+'. '+(d.getMonth()+1)+'.'}

function renderToday(){
 var t=themeById(S.theme),k=view.dayKey,isToday=k===todayKey();
 var st=streak(S),h='';
 h+=header(greet());
 h+='<div class="stack">';
 if(!isToday)h+='<div class="banner"><span>Upravuješ <b>'+WD[wdOf(k)]+' '+fmtDay(k)+'</b></span><button class="pill" data-a="backToday">Späť na dnes</button></div>';
 if(isToday&&canForgiveYesterday(S))h+='<div class="banner"><span>Včera to nevyšlo. Použiť odpustenie a zachrániť sériu?</span><button class="pill" data-a="forgive">Odpustiť</button></div>';
 // streak card
 h+='<div class="card streak"><span class="label">Séria</span><div class="big pop">'+st+'</div><span style="font-size:15px">'+unitWord(st,t.unit)+' v rade</span><div class="dots">';
 for(var i=6;i>=0;i--){var dk=addDays(todayKey(),-i),ds=status(S,dk);h+='<div class="dot '+(ds==='done'?'done':ds==='forgiven'?'forgiven':'')+(i===0?' today':'')+'" title="'+fmtDay(dk)+'">'+WDS[wdOf(dk)]+'</div>'}
 var tk=tokens(S);
 h+='</div><span class="small" style="margin-top:8px">'+tk+' '+plural(tk,'odpustenie','odpustenia','odpustení')+' v zálohe</span>';
 var nc=nextCourt(S);
 if(nc){var need=nc.unlockAt-S.best;h+='<div style="width:100%;margin-top:10px"><div class="small" style="display:flex;justify-content:space-between"><span>Ďalší: <b style="color:var(--text)">'+esc(nc.name)+'</b></span><span>ešte '+need+' '+unitWord(need,'den')+'</span></div><div class="progress"><i style="width:'+Math.min(100,Math.round(S.best/nc.unlockAt*100))+'%"></i></div></div>'}
 else h+='<span class="small" style="margin-top:8px">Všetky dvory odomknuté. Vysoká lady.</span>';
 h+='</div>';
 var tot=totalDone(S),x=daysToXmas();
 h+='<div class="grid2"><div class="card stat"><b style="color:var(--stat1)">'+x+'</b><span class="small">'+plural(x,'deň','dni','dní')+' do Vianoc</span></div><div class="card stat"><b style="color:var(--stat2)">'+tot+'</b><span class="small">'+plural(tot,'splnený deň','splnené dni','splnených dní')+' celkovo</span></div></div>';
 // goals
 var gs=goalsFor(S,k);
 h+='<div class="row" style="justify-content:space-between;margin-top:4px"><h2>'+(isToday?'Dnešné ciele':'Ciele')+'</h2><span class="small">'+WD[wdOf(k)]+' '+fmtDay(k)+'</span></div>';
 if(!activeGoals(S).length)h+='<div class="card stack" style="text-align:center;padding:22px;align-items:center"><span class="gname">Zatiaľ žiadne ciele</span><span class="small">Vyber si 1 až 3 a ideme na to.</span><button class="btn solid" data-a="onbStart" data-v="2">Vybrať ciele</button></div>';
 else if(!gs.length)h+='<div class="card small" style="text-align:center;padding:20px">Dnes nemáš naplánované nič. Oddych je tiež tréning.</div>';
 gs.forEach(function(g){h+=renderGoal(g,k,t)});
 h+='<p class="quip">'+esc(quip(gs,k,t))+'</p>';
 h+='</div>';
 return h;
}
function quip(gs,k,t){
 if(!gs.length)return '';
 var allDone=gs.every(function(g){return isWeekly(g)?(gdone(S,k,g)||weekCount(S,g,k)>=weekTarget(g,k)):gdone(S,k,g)});
 if(allDone)return t.done;
 if(status(S,k)==='done')return 'Na dnes to stačí. Týždenný cieľ dobehneš iný deň.';
 var w=gs.filter(function(g){return g.kind==='water'})[0];
 if(w&&!gdone(S,k,w)){var left=w.target-(+gval(S,k,w)||0);return 'Ešte '+left+' '+plural(left,'pohár','poháre','pohárov')+'.'+t.left}
 return t.nudge;
}

var KINDS=[['exercise','Cvičenie'],['water','Voda'],['sweet','Bez sladkého'],['other','Iné']];
function isDarkTheme(){var t=themeById(S.theme);return !!(t.sky||(t.dark&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))}
function catColor(c){return c?(isDarkTheme()?c.dark:c.light):'var(--accent)'}
function catBadge(g,size){var c=catById(g.cat);if(!c)return '';var col=catColor(c);return '<span class="cbadge" style="width:'+(size||36)+'px;height:'+(size||36)+'px;color:'+col+';background:color-mix(in srgb,'+col+' 16%,transparent)">'+svg(c.icon,(size||36)*0.55,1.8)+'</span>'}
function renderGoal(g,k,t){
 var m=modeOf(g),v=gval(S,k,g),e=entry(S,k).g[g.id]||{},open=view.open[g.id],num=isNum(m);
 var sub='';
 if(e.note)sub=esc(e.note);
 else if(m==='choice'&&v&&e.c)sub='Dnes: '+esc(e.c);
 else if(m==='time')sub='do '+esc(g.time||'');
 else if(m==='quit')sub=v?'Dnes si vydržala. Hrdinka.':'Ťukni, keď dnes vydržíš.';
 else if(g.minNote)sub=esc(g.minNote);
 else sub=t.lines[g.kind]||(!isWeekly(g)&&g.days.length<7?g.days.map(function(d){return WDS[d]}).join(' '):'');
 if(num&&g.min)sub+=(sub?' · ':'')+'minimum '+g.min+(g.unit?' '+esc(g.unit):'');
 var wk='';
 if(isWeekly(g)){var wc=weekCount(S,g,k),wt=weekTarget(g,k);wk='<span class="cups" aria-hidden="true">';for(var wi=0;wi<wt;wi++)wk+='<i class="cup wk'+(wi<wc?' on':'')+'"></i>';wk+='</span>';sub=(wc>=wt?'Týždeň splnený! ':'')+wc+' / '+wt+' tento týždeň'+(sub?' · '+sub:'')}
 var full=num&&g.min&&(+v||0)>=g.target;
 var h='<div class="card"><div class="row">'+catBadge(g)+'<button class="gtap grow" data-a="toggleOpen" data-id="'+g.id+'" aria-expanded="'+(open?'true':'false')+'"><span class="gname">'+(e.e?e.e+' ':'')+esc(g.name)+(num?' <span style="font-size:12px;font-weight:500;color:var(--accent)">'+(+v||0)+' / '+g.target+(g.unit?' '+esc(g.unit):'')+'</span>':'')+(full?' <span aria-label="plný cieľ" style="color:var(--streak)">★</span>':'')+'</span><span class="gsub">'+sub+'</span>'+wk;
 if(num){
  if(g.target<=12&&stepOf(g)===1){h+='<span class="cups" aria-hidden="true">';for(var i=0;i<g.target;i++)h+='<i class="cup'+(i<v?' on':'')+'"></i>';h+='</span>'}
  else h+='<span class="progress" style="display:block"><i style="width:'+Math.min(100,Math.round((+v||0)/g.target*100))+'%"></i></span>';
 }
 h+='</button>';
 if(num){
  var st=stepOf(g),lbl=g.kind==='water'?'pohár':(m==='duration'?st+' min':(st===1?'1':st));
  if(v>0)h+='<button class="pill ghost" data-a="dec" data-id="'+g.id+'" aria-label="Uber: '+esc(g.name)+'">−</button>';
  h+='<button class="pill" data-a="inc" data-id="'+g.id+'" aria-label="Pridaj: '+esc(g.name)+'">+ '+lbl+'</button>';
 } else {
  h+='<button class="check'+(v?' on':'')+'" data-a="check" data-id="'+g.id+'" aria-pressed="'+(v?'true':'false')+'" aria-label="'+(m==='quit'?'Vydržala som: ':'Splnené: ')+esc(g.name)+'">'+(v?svg(CHECK,20,2.5):'')+'</button>';
 }
 h+='</div>';
 var showChoice=m==='choice'&&g.options&&g.options.length&&(open||(v&&!e.c));
 if(showChoice){
  h+='<div class="extra"><span class="small">Čo si dnes robila?</span><div class="chips" role="group" aria-label="Čo si robila">';
  g.options.forEach(function(o){h+='<button class="chip'+(e.c===o?' on':'')+'" data-a="choose" data-id="'+g.id+'" data-v="'+esc(o)+'" aria-pressed="'+(e.c===o?'true':'false')+'">'+esc(o)+'</button>'});
  h+='</div></div>';
 }
 if(open){
  h+='<div class="extra"><label class="f">Poznámka<textarea data-a="note" data-id="'+g.id+'" placeholder="napr. ako to dnes išlo…">'+esc(e.note||'')+'</textarea></label><div class="emojis" role="group" aria-label="Emoji">';
  EMOJIS.forEach(function(em){h+='<button class="emo'+(e.e===em?' on':'')+'" data-a="emoji" data-id="'+g.id+'" data-v="'+em+'" aria-pressed="'+(e.e===em?'true':'false')+'">'+em+'</button>'});
  h+='</div></div>';
 }
 return h+'</div>';
}

function goalDesc(g){var m=modeOf(g),d=m==='count'?g.target+(g.unit?' '+esc(g.unit):''):m==='duration'?g.target+' min':m==='time'?'do '+esc(g.time||''):m==='choice'?'áno + čo':m==='quit'?'zbaviť sa':'áno / nie';var c=catById(g.cat);return (c?c.name+' · ':'')+d+' · '+(isWeekly(g)?(g.perWeek||3)+'× za týždeň':(g.days.length===7?'každý deň':g.days.map(function(x){return WDS[x]}).join(' ')))}
function syncForm(){var sel=document.getElementById('gf-mode');if(!sel)return;var m=sel.value;document.querySelectorAll('[data-modes]').forEach(function(el){el.style.display=el.getAttribute('data-modes').split(' ').indexOf(m)>=0?'':'none'})}
function saveGoalFromForm(id){
 var $=function(x){return document.getElementById(x)};
 var m=$('gf-mode').value,num=isNum(m);
 var name=$('gf-name').value.trim()||'Nový cieľ';
 var target=num?Math.max(1,Math.min(100000,parseInt($('gf-target').value,10)||1)):1;
 var min=num?Math.max(0,Math.min(target,parseInt($('gf-min').value,10)||0)):0;
 var freq=$('gf-freq').value,per=Math.max(1,Math.min(7,parseInt($('gf-per').value,10)||3));
 var opts=$('gf-opts').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
 var data={name:name,cat:$('gf-cat').value,mode:m,type:num?'count':'check',target:target,min:min,unit:m==='duration'?'min':(m==='count'?$('gf-unit').value.trim():''),
  time:m==='time'?$('gf-time').value:'',options:m==='choice'?(opts.length?opts:['iné']):null,days:formDays.length?formDays.slice():[0,1,2,3,4,5,6],kind:$('gf-kind').value,freq:freq,perWeek:per};
 var T0=todayKey();
 if(id==='new'){data.id='g'+Date.now().toString(36);data.since=T0;S.goals.push(data);return}
 var og=goal(id);
 var ruleChanged=modeOf(og)!==m||og.target!==data.target||(og.min||0)!==min||(og.time||'')!==data.time||(og.freq||'days')!==data.freq||(isWeekly(data)&&(og.perWeek||3)!==data.perWeek)||(!isWeekly(data)&&og.days.join()!==data.days.join());
 if(ruleChanged&&og.since!==T0){
  var ng={};for(var kk in og)ng[kk]=og[kk];for(var kk2 in data)ng[kk2]=data[kk2];
  ng.id='g'+Date.now().toString(36);ng.since=T0;delete ng.until;og.until=addDays(T0,-1);
  if(S.log[T0]&&S.log[T0].g&&S.log[T0].g[og.id]){S.log[T0].g[ng.id]=S.log[T0].g[og.id];delete S.log[T0].g[og.id]}
  S.goals.splice(S.goals.indexOf(og)+1,0,ng);
 } else {for(var kk3 in data)og[kk3]=data[kk3]}
}

  h+='<div class="ostack"><button class="obtn" data-a="onbNext">Poďme na to</button><button class="obtn-link" data-a="onbSkip">Preskočiť, nastavím si to sama</button></div>';
 } else if(o.step===2){
  h+='<div><h1 class="oh1">Čo chceš zmeniť?</h1><p class="osub">Vyber 1 až 3 veci. Menej je viac, fakt.</p></div><div class="ogrid">';
  CATS.forEach(function(c){var on=o.cats.indexOf(c.id)>=0;h+='<button class="otile'+(on?' on':'')+'" style="--c:'+c.dark+'" data-a="onbCat" data-v="'+c.id+'" aria-pressed="'+(on?'true':'false')+'">'+(on?'<span class="obadge">'+svg(CHECK,12,3.2)+'</span>':'')+'<span class="oico">'+svg(c.icon,24,1.7)+'</span><span>'+c.name+'</span></button>'});
  h+='</div><div class="ogrow"></div><div class="ostack"><span class="osub" style="font-size:13px" role="status">'+(o.msg?esc(o.msg):'Vybrané <b style="color:#F1E3B0">'+o.cats.length+' z 3</b>')+'</span><button class="obtn" data-a="onbNext"'+(o.cats.length?'':' disabled')+'>Ďalej</button></div>';
 } else if(o.step===3){
  h+='<div><h1 class="oh1" style="font-size:34px">Tvoje ciele</h1><p class="osub">Vyber si 1–2 v každej oblasti. Začneme zľahka, pridať môžeš vždy.</p></div>';
  o.cats.forEach(function(cid){
   var c=catById(cid),picks=o.picks[cid]||[];
   h+='<div class="osec" style="--c:'+c.dark+'"><div class="osech">'+svg(c.icon,18,1.8)+'<span>'+c.name+'</span></div>';
   c.sug.forEach(function(s,i){
    var on=picks.indexOf(i)>=0,key=cid+':'+i,val=o.vals[key]!=null?o.vals[key]:sugValue(s);
    h+='<button class="oopt'+(on?' on':'')+'" data-a="onbSug" data-v="'+key+'" aria-pressed="'+(on?'true':'false')+'"><span class="obox">'+(on?svg(CHECK,11,3.2):'')+'</span><span class="ogrow">'+esc(s.name)+'</span><span class="otag">'+esc(sugTag(s,val))+'</span></button>';
    if(on&&(s.freq==='week'||isNum(s.mode))){
     h+='<div class="ostep"><span>'+(s.minNote?esc(s.minNote):'Uprav si číslo')+'</span><span class="row" style="gap:8px"><button class="ostepb" data-a="onbVal" data-v="'+key+'" data-d="-1" aria-label="Menej">−</button><b>'+esc(sugTag(s,val).replace(' denne',''))+'</b><button class="ostepb" data-a="onbVal" data-v="'+key+'" data-d="1" aria-label="Viac">+</button></span></div>';
    }
   });
   (o.custom[cid]||[]).forEach(function(nm,ci){h+='<label class="ofield" style="margin:0"><span class="sr">Názov vlastného cieľa</span><input data-a="onbCustom" data-v="'+cid+'" data-i="'+ci+'" value="'+esc(nm)+'" placeholder="Napíš svoj cieľ…"></label>'});
   h+='<button class="oadd" data-a="onbAddCustom" data-v="'+cid+'">'+svg('<path d="M12 5v14M5 12h14"/>',16,2)+'Vlastný cieľ v kategórii '+c.name+'</button></div>';
  });
  h+='<div class="ogrow"></div><button class="obtn" data-a="onbNext">Ďalej</button>';
 } else {
  var sel=onbSelected(),sd='';
  ['Po','Ut','St','Št','Pi','So','Ne'].forEach(function(d,i){sd+='<span class="osd'+(i<4?' on':'')+'">'+d+'</span>'});
  var CR=[['#F4F8EE','#4E7A3C','Jar'],['#F1FAF9','#0F7480','Leto'],['#1E110C','#E0B04E','Jeseň'],['#EEF4FA','#2F6AA0','Zima'],['#FBF1EE','#A9476E','Úsvit'],['#FFF9EC','#7A5C12','Deň'],['#0A0E24','#A493FF','Noc']],cp='';
  CR.forEach(function(x,i){cp+='<span class="ocourt'+(i===0?' on':'')+'"><i style="background:'+x[0]+'"><b style="background:'+x[1]+'"></b></i>'+x[2]+'</span>'});
  h+='<h1 class="oh1" style="font-size:34px">Ako to funguje</h1>';
  h+=onbCard('<path d="M12 3c2 3 5 4.5 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-7.5z"/>','#F1E3B0','Séria','Splníš ciele a deň sa ráta. Pozor, návyk je chytľavý.','<div class="row" style="justify-content:space-between">'+sd+'</div>');
  h+=onbCard('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>','#F2A9CF','Odpustenie','Zlý deň sa stane. Odpustenie zachráni sériu, ďalšie dostaneš za 7 splnených dní.','');
  h+=onbCard('<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>','#A493FF','Dvory','Za sériu odomykáš dvory a s nimi nový vzhľad appky. Feyrina cesta začína na jar.','<div class="row" style="justify-content:space-between">'+cp+'</div>');
  if(sel.length)h+=onbCard('<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/>','#9FE3A8','Tvoj prvý deň','Toto ťa čaká už dnes:','<div class="chips">'+sel.map(function(x){return '<span class="ochip" style="--c:'+x.cat.dark+'">'+svg(x.cat.icon,14,2)+esc(x.s.name)+'</span>'}).join('')+'</div>');
  h+='<div class="ogrow"></div><p class="osub" style="text-align:center;font-size:14px">K hviezdam, ktoré počúvajú, a k návykom, ktoré vydržia.</p><button class="obtn" data-a="onbFinish">Ideme na to</button>';
 }
 return h+'</div></div>';
}
function onbCard(icon,col,title,text,inner){return '<div class="ocard"><div class="row" style="align-items:flex-start;gap:12px"><span class="oico sm" style="--c:'+col+'">'+svg(icon,22,1.7)+'</span><div><span class="gname">'+title+'</span><span class="osub" style="font-size:13.5px;display:block;margin-top:3px">'+text+'</span></div></div>'+inner+'</div>'}
function finishOnboarding(){
 var o=view.onb,sel=onbSelected();
 if(o.name&&o.name.trim())S.name=o.name.trim().slice(0,40);
 var fresh=!S.goals.length&&!Object.keys(S.log).length;
 sel.forEach(function(x){var g=buildGoal(x.s,x.cat.id,x.val);S.goals.push(g)});
 if(fresh)S.start=todayKey();
 S.onboarded=true;view.onb=null;view.tab='today';view.dayKey=todayKey();commit();window.scrollTo(0,0);
}
function onbClick(a,el){
 var o=view.onb,v=el.getAttribute('data-v');
 switch(a){
  case 'onbNext':if(o.step===2&&!o.cats.length)return true;if(o.step===2){o.cats.forEach(function(cid){if(!o.picks[cid]){o.picks[cid]=[0]}})}o.step++;o.msg='';render();var ov=document.querySelector('.onb');if(ov)ov.scrollTop=0;return true;
  case 'onbBack':o.step=Math.max(1,o.step-1);o.msg='';render();return true;
  case 'onbSkip':S.onboarded=true;if(o.name&&o.name.trim())S.name=o.name.trim().slice(0,40);view.onb=null;commit();return true;
  case 'onbCat':var ix=o.cats.indexOf(v);if(ix>=0){o.cats.splice(ix,1);o.msg=''}else if(o.cats.length>=3){o.msg='Najviac 3. Menej je viac, fakt.'}else{o.cats.push(v);o.msg=''}render();return true;
  case 'onbSug':var p=v.split(':'),arr=o.picks[p[0]]=o.picks[p[0]]||[],si=+p[1],j=arr.indexOf(si);if(j>=0)arr.splice(j,1);else arr.push(si);render();return true;
  case 'onbVal':var q=v.split(':'),s=catById(q[0]).sug[+q[1]],cur=o.vals[v]!=null?o.vals[v]:sugValue(s),d=+el.getAttribute('data-d');
   if(s.freq==='week')cur=Math.max(1,Math.min(7,cur+d));else{var st=s.step||(s.mode==='duration'?(s.target<5?1:5):1);cur=Math.max(st,cur+d*st)}
   o.vals[v]=cur;render();return true;
  case 'onbAddCustom':(o.custom[v]=o.custom[v]||[]).push('');render();var ins=document.querySelectorAll('[data-a=onbCustom][data-v="'+v+'"]');if(ins.length)ins[ins.length-1].focus();return true;
  case 'onbFinish':finishOnboarding();return true;
 }
 return false;
}

/* ---- events ---- */
function goal(id){for(var i=0;i<S.goals.length;i++)if(S.goals[i].id===id)return S.goals[i]}
var formDays=null;
document.addEventListener('click',function(ev){
 var el=ev.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v'),k=view.dayKey;
 if(view.onb&&a.indexOf('onb')===0){if(a==='onbName'||a==='onbCustom')return;onbClick(a,el);return}
 if(a==='closeSheetBg'){if(ev.target===el){view.sheet=false;view.editGoal=null;render()}return}
 if(a==='note'||a==='name'||a==='importText'||a==='start')return;
 switch(a){
  case 'tab':view.tab=v;if(v==='today')view.dayKey=todayKey();render();window.scrollTo(0,0);break;
  case 'check':var g=goal(id);setVal(S,k,g,!gval(S,k,g));commit();break;
  case 'inc':g=goal(id);setVal(S,k,g,Math.min(g.target*3,(+gval(S,k,g)||0)+1));commit();break;
  case 'dec':g=goal(id);setVal(S,k,g,Math.max(0,(+gval(S,k,g)||0)-1));commit();break;
  case 'choose':g=goal(id);S.log[k]=S.log[k]||{g:{}};var ce=S.log[k].g[id]||{v:false,note:'',e:''};ce.c=v;ce.v=true;S.log[k].g[id]=ce;commit();break;
  case 'onbStart':startOnboarding(+(v||1));break;
  case 'toggleOpen':view.open[id]=!view.open[id];render();break;
  case 'emoji':g=goal(id);S.log[k]=S.log[k]||{g:{}};var e=S.log[k].g[id]||{v:g.type==='count'?0:false,note:'',e:''};e.e=e.e===v?'':v;S.log[k].g[id]=e;commit();break;
  case 'forgive':if(forgiveYesterday(S))commit();break;
  case 'backToday':view.dayKey=todayKey();render();break;
  case 'calPrev':case 'calNext':var p=view.calMonth.split('-'),d=new Date(+p[0],+p[1]-1+(a==='calNext'?1:-1),1);view.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break;
  case 'calSel':view.calSel=view.calSel===v?null:v;render();break;
  case 'editDay':view.dayKey=v;view.tab='today';render();window.scrollTo(0,0);break;
  case 'setTheme':S.theme=v;view.toast=null;commit();break;
  case 'closeToast':view.toast=null;render();break;
  case 'settings':view.sheet=true;view.importMsg='';render();break;
  case 'closeSheet':view.sheet=false;view.editGoal=null;render();break;
  case 'editGoal':view.editGoal=id;view.confirmDel=null;var gg=id==='new'?null:goal(id);formDays=gg?gg.days.slice():[0,1,2,3,4,5,6];render();break;
  case 'moveGoal':var A=activeGoals(S),ai=-1;A.forEach(function(x,i){if(x.id===id)ai=i});var aj=ai+(+v);if(ai>=0&&aj>=0&&aj<A.length){var mi=S.goals.indexOf(A[ai]),mj=S.goals.indexOf(A[aj]);var tmp=S.goals[mi];S.goals[mi]=S.goals[mj];S.goals[mj]=tmp;commit()}break;
  case 'cancelGoal':view.editGoal=null;render();break;
  case 'gfDay':var i=+v,ix=formDays.indexOf(i);if(ix>=0)formDays.splice(ix,1);else formDays.push(i);formDays.sort();el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));break;
  case 'saveGoal':saveGoalFromForm(id);view.editGoal=null;commit();break;
  case 'delGoal':if(view.confirmDel===id){var dg=goal(id),T1=todayKey();if(dg.since===T1)S.goals=S.goals.filter(function(x){return x.id!==id});else dg.until=addDays(T1,-1);view.editGoal=null;view.confirmDel=null;commit()}else{view.confirmDel=id;render()}break;
  case 'copyBackup':var txt=JSON.stringify(S);try{navigator.clipboard.writeText(txt).then(function(){view.importMsg='Záloha je v schránke. Ulož si ju napríklad do Poznámok.';render()},function(){view.importText=txt;view.importMsg='Kopírovanie nevyšlo, záloha je v poli nižšie. Označ a skopíruj ju.';render()})}catch(x){view.importText=txt;view.importMsg='Záloha je v poli nižšie, skopíruj ju.';render()}break;
  case 'doImport':try{var obj=JSON.parse(view.importText);if(!obj||!obj.goals||!obj.log)throw 0;S=normalize(obj);view.importText='';view.importMsg='Obnovené.';commit()}catch(x){view.importMsg='Toto nevyzerá ako záloha z appky.';render()}break;
 }
});
var noteTimer=null;
document.addEventListener('input',function(ev){
 var el=ev.target,a=el.getAttribute&&el.getAttribute('data-a');
 if(a==='note'){var id=el.getAttribute('data-id'),g=goal(id),k=view.dayKey;S.log[k]=S.log[k]||{g:{}};var e=S.log[k].g[id]||{v:g.type==='count'?0:false,note:'',e:''};e.note=el.value;S.log[k].g[id]=e;S.updatedAt=Date.now();saveLocal();clearTimeout(noteTimer);noteTimer=setTimeout(queueWrite,900)}
 else if(a==='name'){S.name=el.value.slice(0,40);S.updatedAt=Date.now();saveLocal();clearTimeout(noteTimer);noteTimer=setTimeout(function(){queueWrite();var h=document.querySelector('h1');},900)}
 else if(a==='importText'){view.importText=el.value}
 else if(a==='onbName'&&view.onb){view.onb.name=el.value}

});
document.addEventListener('change',function(ev){var a=ev.target.getAttribute&&ev.target.getAttribute('data-a');if(a==='gfMode'){syncForm();return}if(a==='gfFreq'){var w=ev.target.value==='week';document.getElementById('gf-week-wrap').style.display=w?'flex':'none';document.getElementById('gf-days-wrap').style.display=w?'none':'flex';return}if(a==='start'){var v=ev.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=todayKey()){S.start=v;commit()}return}if(a==='note'||a==='name')render()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&(view.sheet||view.toast)){view.sheet=false;view.toast=null;render()}});
// nový deň pri návrate do appky
var lastDay=todayKey();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&todayKey()!==lastDay){lastDay=todayKey();view.dayKey=lastDay;refreshProgress(S);render()}});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render)}catch(e){}

refreshProgress(S);
if(!S.onboarded)view.onb={step:1,name:S.name||'',cats:[],picks:{},vals:{},custom:{},msg:''};
render();
initSync();
