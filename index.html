function bookSet(g,k,page){var prev=bookPage(S,g,k);S.log[k]=S.log[k]||{g:{}};var e=S.log[k].g[g.id]||{v:0,note:'',e:''};if(e.b!==g.bookId){e.v0=e.b?(+e.v||0):0}e.b=g.bookId;e.p=page;e.v=(e.v0||0)+Math.max(0,page-prev);S.log[k].g[g.id]=e;var fin=false;S.read=S.read||[];if(g.pages&&page>=g.pages&&!g.finished){g.finished=k;S.read.push({t:g.book,p:g.pages,d:k});fin=true}else if(g.finished&&g.pages&&page<g.pages){var f=g.finished;S.read=S.read.filter(function(r){return !(r.t===g.book&&r.d===f)});delete g.finished}commit();if(fin){launchConfetti('happy');showBanner('Kniha dočítaná!','„'+g.book+'“ je za tebou.')}}
